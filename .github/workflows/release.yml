name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.2"

      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          for arch in amd64 arm64; do
            name="menukey_${VERSION}_darwin_${arch}"
            GOOS=darwin GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/seiji/menukey/cmd.version=${VERSION}" \
              -o "dist/menukey" .
            tar -C dist -czf "dist/${name}.tar.gz" menukey
          done
          rm dist/menukey

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.tar.gz --clobber
          else
            gh release create "$VERSION" dist/*.tar.gz --generate-notes
          fi
